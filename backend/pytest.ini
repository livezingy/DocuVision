[pytest]
# P-008: one collection error must not abort the whole suite (measured 2026-09-16:
# a single broken test file left 430 tests unrun, and the failure looked like a pass-by-
# omission). Errors stay reported and pytest still exits non-zero - the flag only lets
# the remaining tests run and produce a result.
addopts = --continue-on-collection-errors
