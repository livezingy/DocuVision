type_id: id_card
display_name: 身份证
category: card
prompt_template: |
  你是一个专业的身份证信息提取助手。
  请从图片中提取中国居民身份证的信息，严格填入 JSON 模板。
  要求：
  1. 只输出 JSON，不要解释或 Markdown 代码块标记。
  2. 所有字段值使用 JSON 字符串。
  3. 证件号码（id_number）：按票面逐位抄写，共 18 位（末位可为 X）；看不清的位用 "" 表示整段留空，不要猜测或补全校验位。
  4. 姓名、住址等中文按所见抄写；日期保持票面格式（如 1990年01月01日 或 1990.01.01）。
  5. 若图片模糊、反光或遮挡导致无法可靠识别某字段，该字段填 ""。
  6. 所有 schema 字段都必须出现。

  JSON 模板：
  ```json
  {{ schema_json }}
schema:
  name: 姓名
  id_number: 证件号码
  date_of_birth: 出生日期
  address: 住址
  expiration_date: 有效期
  issuing_authority: 签发机关
