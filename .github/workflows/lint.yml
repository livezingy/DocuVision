# File-size + route-architecture gate (v1.8.2).
# Rules: DEVELOPMENT.md; kernel: docs/agent-ops/core/routing.md.
# Both scripts are stdlib-only (no pip install needed).

name: Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**", "scripts/**", ".github/workflows/lint.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", "scripts/**", ".github/workflows/lint.yml"]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: File-size gate (500-line budget + ratchet)
        run: python scripts/lint_file_size.py

      - name: Route-architecture lint
        run: python scripts/lint_routes.py
