# DocuVision Semantic Mapping Rules
# Version: 1.0.0  |  Taxonomy: azure-like-v1
# Edit rules here and call POST /api/v1/tasks/{id}/remapping to reprocess stored results.

config:
  mapping_version: "1.0.0"
  taxonomy_version: "azure-like-v1"
  default_role: "Paragraph"
  confidence_policy:
    min_block_confidence: 0.0
    demote_if_below: 0.2
  storage:
    keep_raw_role: true
    keep_rule_hit_trace: true
    keep_mapping_version: true

taxonomy:
  - Title
  - SectionHeading
  - Paragraph
  - PageHeader
  - PageFooter
  - Table
  - Figure
  - Caption
  - Formula
  - Footnote
  - Reference
  - KeyValuePair
  - Unknown

# ─────────────────────────────────────────────────────────────────────────────
# Label normalisation aliases
# Maps every raw label produced by PPStructure / PaddleOCR to a canonical key
# used in the rules below.
# ─────────────────────────────────────────────────────────────────────────────
normalize:
  raw_label_alias:
    # Titles / headings
    doc_title: doc_title
    title: doc_title
    paragraph_title: paragraph_title
    heading: paragraph_title
    h1: doc_title
    h2: paragraph_title
    h3: paragraph_title

    # Body text variants
    text: text
    paragraph: text
    content: text
    body: text
    aside_text: text
    list: text
    list_item: text

    # Header / footer
    header: header
    header_image: header
    footer: footer
    footer_image: footer
    page_header: header
    page_footer: footer
    number: footer          # page-number regions often detected as "number"

    # Structural elements
    table: table
    table_title: table_title
    figure: figure
    image: figure
    figure_title: figure_title
    chart_title: figure_title

    # Special content
    formula: formula
    equation: formula
    reference: reference
    doc_index: reference
    footnote: footnote

# ─────────────────────────────────────────────────────────────────────────────
# Mapping rules — evaluated in descending priority order.
# First matching rule wins.
# ─────────────────────────────────────────────────────────────────────────────
rules:
  # ── Titles ────────────────────────────────────────────────────────────────
  - id: R001
    enabled: true
    priority: 1000
    when:
      raw_label_in: [doc_title]
    then:
      semantic_role: Title

  # ── Section headings ──────────────────────────────────────────────────────
  - id: R002
    enabled: true
    priority: 950
    when:
      raw_label_in: [paragraph_title]
    then:
      semantic_role: SectionHeading

  # ── Page header ───────────────────────────────────────────────────────────
  - id: R003
    enabled: true
    priority: 900
    when:
      raw_label_in: [header]
    then:
      semantic_role: PageHeader

  # ── Page footer ───────────────────────────────────────────────────────────
  - id: R004
    enabled: true
    priority: 900
    when:
      raw_label_in: [footer]
    then:
      semantic_role: PageFooter

  # ── Tables ────────────────────────────────────────────────────────────────
  - id: R005
    enabled: true
    priority: 900
    when:
      raw_label_in: [table]
    then:
      semantic_role: Table

  # ── Figures / images ──────────────────────────────────────────────────────
  - id: R006
    enabled: true
    priority: 900
    when:
      raw_label_in: [figure]
    then:
      semantic_role: Figure

  # ── Captions (figure/table titles) ────────────────────────────────────────
  - id: R007
    enabled: true
    priority: 850
    when:
      raw_label_in: [figure_title, table_title]
    then:
      semantic_role: Caption

  # ── Mathematical formulas ─────────────────────────────────────────────────
  - id: R008
    enabled: true
    priority: 850
    when:
      raw_label_in: [formula]
    then:
      semantic_role: Formula

  # ── References / bibliography ─────────────────────────────────────────────
  - id: R009
    enabled: true
    priority: 800
    when:
      raw_label_in: [reference]
    then:
      semantic_role: Reference

  # ── Footnotes ─────────────────────────────────────────────────────────────
  - id: R010
    enabled: true
    priority: 800
    when:
      raw_label_in: [footnote]
    then:
      semantic_role: Footnote

  # ── Domain-specific key-value pairs (invoice / contract / receipt) ─────────
  - id: R011
    enabled: true
    priority: 700
    when:
      raw_label_in: [text]
      doc_type_in: [invoice, receipt, contract]
      text_regex_any:
        - "(?i)invoice\\s*no|发票号|单据号|合同编号|receipt\\s*no"
        - "(?i)total|subtotal|tax|amount\\s*due|合计|税额|价税合计"
        - "(?i)date|due\\s*date|日期|到期日"
        - "(?i)vendor|buyer|seller|供应商|买方|卖方"
    then:
      semantic_role: KeyValuePair

  # ── Generic paragraph fallback (catch-all for body text) ─────────────────
  - id: R012
    enabled: true
    priority: 100
    when:
      raw_label_in: [text]
    then:
      semantic_role: Paragraph

# ─────────────────────────────────────────────────────────────────────────────
# Post-processing hints (read by CanonicalConverter, not enforced server-side)
# ─────────────────────────────────────────────────────────────────────────────
postprocess:
  merge_adjacent_blocks:
    enabled: true
    same_role_only: true
    same_page_only: true
    max_vertical_gap_px: 12
    max_horizontal_overlap_ratio: 0.2

  right_panel_group_order:
    - Title
    - SectionHeading
    - Paragraph
    - PageHeader
    - PageFooter
    - Table
    - Figure
    - Caption
    - Formula
    - Footnote
    - Reference
    - KeyValuePair
    - Unknown

# ─────────────────────────────────────────────────────────────────────────────
# Persistence / audit configuration
# ─────────────────────────────────────────────────────────────────────────────
persistence:
  output_fields:
    - block_id
    - page_id
    - block_type_raw
    - block_type_norm
    - semantic_role
    - mapping_rule_id
    - mapping_version
    - taxonomy_version
    - confidence
  audit_fields:
    - matched_conditions
    - fallback_used
