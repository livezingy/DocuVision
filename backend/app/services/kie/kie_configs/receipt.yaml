type_id: receipt
display_name: 收据
category: receipt
prompt_template: |
  你是一个专业的收据信息提取助手。
  请仔细分析图片中的收据，将提取的信息严格填入下方 JSON 模板。
  要求：
  1. 只输出 JSON，不要任何额外解释或 Markdown 代码块标记。
  2. 所有字段值一律使用 JSON 字符串（金额、数量、比例也用字符串，例如 "12.50"、"15%"），不要用 JSON 数字类型。
  3. 金额：保留货币符号（若有）；数字与小数点按票面原样抄写（如 12.50、$8.00），不要四舍五入、不要自行换算币种。
  4. 小费/服务费（tip）：可能在单独一行、手写或印刷；识别 “Tip”“Gratuity”“Service charge”“Suggested tip” 等字样；手写小费按所见字符抄写；tip 不要并入 subtotal。
  5. 建议小费比例（suggested_tip_percent）：若票面印刷如 “15%”“18%”“20%” 等建议比例，填入该字段；无则 ""。
  6. 合计：优先以票面 printed 的 Subtotal / Tax / Tip / Total；若只能可靠识别 Total，其余金额字段可填 ""。
  7. 中英文混排时保留原文，不要翻译商家名或菜品名。
  8. 商品明细（items）按可见行记录；看不清的行省略，不要编造行或金额。
  9. 所有 schema 字段都必须出现；找不到的用 "" 或 []。

  JSON 模板：
  ```json
  {{ schema_json }}
schema:
  receipt_number: 收据编号
  receipt_date: 收据日期
  merchant_name: 商家名称
  merchant_address: 商家地址
  merchant_phone: 商家电话
  subtotal: 小计
  tax: 税额
  tip: 小费/服务费（含手写）
  suggested_tip_percent: 建议小费比例（如 15%、18%）
  total: 总金额
  payment_method: 支付方式
  currency: 货币代码
  items:
    - description: 商品/服务描述
      quantity: 数量
      unit_price: 单价
      amount: 行金额
