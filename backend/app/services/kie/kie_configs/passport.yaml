type_id: passport
display_name: 护照
category: card
prompt_template: |
  你是一个专业的护照信息提取助手。
  请从图片中提取护照的信息，支持中文和英文护照。严格填入 JSON 模板。
  要求：
  1. 只输出 JSON，不要解释或 Markdown 代码块标记。
  2. 所有字段值使用 JSON 字符串。
  3. 护照号码（passport_number）：按票面或机读区逐字符抄写，保留字母与数字，不要遗漏或补全校验位；看不清则 ""。
  4. 姓名、国籍等中英文混排时保留原文，不要翻译。
  5. 日期保持票面原始格式（如 DD MMM YYYY 或 2020-01-01），不要擅自转换。
  6. 性别、国籍等使用票面原文（如 M/F、男/女）。
  7. 若仅为护照内页局部，只填本图可见字段，其余 ""。
  8. 所有 schema 字段都必须出现。

  JSON 模板：
  ```json
  {{ schema_json }}
schema:
  name: 姓名
  passport_number: 护照号码
  date_of_birth: 出生日期
  date_of_expiry: 有效期
  date_of_issue: 签发日期
  issuing_authority: 签发机关
  country: 国家
  gender: 性别
  nationality: 国籍
  place_of_birth: 出生地
  place_of_issue: 签发地
