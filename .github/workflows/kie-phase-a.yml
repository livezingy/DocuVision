# Cloud validation Phase A — KIE contract tests (CPU, no Paddle, no Qwen weights).
# See docs/architecture/CLOUD_VALIDATION.md

name: KIE Phase A

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/kie-phase-a.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/kie-phase-a.yml"

concurrency:
  group: kie-phase-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kie-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-ci-phase-a.txt

      - name: Install Phase A dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci-phase-a.txt

      - name: Run Phase A pytest
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_kie_field_metrics.py tests/test_kie_service.py \
            tests/test_kie_return_raw_contract.py tests/test_orchestrator_order.py \
            -q --tb=short
