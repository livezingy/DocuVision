[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docuvision-core"
version = "0.1.0"
description = "Shared table extraction and OCR engines for DocuVision Lite and Pro"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["docuvision_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
