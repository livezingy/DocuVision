# Agent-ops audit — detect kernel-ref + living-doc drift + module-map recon.
# Unified framework: scripts/audit_agent_ops.py (no third-party deps).
# See docs/agent-ops/operations.md; check 3 (module-map) added by P-004.

name: Agent-ops Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 2026-09-20 (branch protection): `paths` dropped so the required check `agent-ops-audit`
    # reports on every PR - a path-filtered workflow that does not run leaves its required
    # check in "Expected" and the PR can never merge (see lint.yml). The P-011 route-B
    # coarse list (what can flip the audit verdict) stays the reference for re-narrowing
    # if CI ever becomes billable; the audit job itself is ~9s.

concurrency:
  group: agent-ops-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-ops-audit:
    # Pinned (2026-09-20): the ubuntu-latest label migrates to Ubuntu 26 on 2026-10-19; see
    # .github/workflows/lint.yml for the rationale and docs/agent-ops/operations.md for the record.
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Audit parser selftest (in-memory, P-004)
        run: python scripts/audit_agent_ops.py --selftest

      - name: Run agent-ops audit (kernel-ref + doc drift + module-map)
        run: python scripts/audit_agent_ops.py
