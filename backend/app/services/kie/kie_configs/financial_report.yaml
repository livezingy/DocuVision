type_id: financial_report
display_name: Financial Report
category: document
prompt_template: |
  You are a financial report analyst. Extract transaction-like line items from this document page.
  Output JSON only (no markdown fences).

  Rules:
  1. Populate `transactions[]` with visible rows (date, description, amount, category if shown).
  2. Use strings for all values; empty string if not visible.
  3. Do not invent rows.

  JSON template:
  ```json
  {{ schema_json }}
schema:
  report_title: Report title
  report_period: Reporting period
  currency: Currency code
  transactions:
    - date: Transaction date
      description: Line description
      amount: Amount
      category: Category or type
      reference: Reference number
