# Cloud validation Phase A — KIE + v1.4 table mapping contract tests (CPU, no Paddle, no Qwen weights).
# See docs/architecture/CLOUD_VALIDATION.md

name: KIE Phase A

# Push does not trigger CI by default. Run manually (workflow_dispatch) or open a PR to main.
# Optional push trigger: include "[run ci]" in the commit message (see .cursor/rules/003-git.mdc).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/docuvision-core/**"
      - ".github/workflows/kie-phase-a.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/docuvision-core/**"
      - ".github/workflows/kie-phase-a.yml"

concurrency:
  group: kie-phase-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kie-contract:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run ci]')
    # Pinned (2026-09-20): the ubuntu-latest label migrates to Ubuntu 26 on 2026-10-19; see
    # .github/workflows/lint.yml for the rationale and docs/agent-ops/operations.md for the record.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements-ci-phase-a.txt
            packages/docuvision-core/pyproject.toml

      - name: Install Phase A dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci-phase-a.txt
          # Explicit core install (v1.8: the `[lite]`/`[ocr-heavy]` extras no longer exist, so the
          # extra only produced a pip warning). Note backend/tests/conftest.py also puts the core dir
          # on sys.path and the kept modules are stdlib-only, so this step is belt-and-braces rather
          # than the sole mechanism — see the comment there.
          pip install -e ../packages/docuvision-core

      # test_route_contract_freeze.py / test_route_inventory.py are pure AST scans
      # (no ``import app.main``, no paddle) so they run here; they catch route
      # contract drift at PR time instead of only locally (PENDING P-003 item 2).
      - name: Run Phase A pytest (Pro)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_kie_field_metrics.py tests/test_kie_service.py \
            tests/test_kie_return_raw_contract.py tests/test_orchestrator_order.py \
            tests/test_table_template_analyze.py tests/test_hitl_policy.py \
            tests/test_task_kie_fields_patch.py tests/test_pdf_tools_service.py \
            tests/test_route_contract_freeze.py tests/test_route_inventory.py \
            -q --tb=short

      # test_table_result_mapper.py was retired with the idle core modules
      # (1c9807c, v1.8); only the column-mapping contract test remains.
      - name: Run Phase A pytest (docuvision-core mapping)
        working-directory: packages/docuvision-core
        run: pytest tests/processing/test_table_column_mapping.py -q --tb=short
