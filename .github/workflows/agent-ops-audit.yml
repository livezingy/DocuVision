# Agent-ops audit — detect kernel-ref + living-doc drift + module-map recon.
# Unified framework: scripts/audit_agent_ops.py (no third-party deps).
# See docs/agent-ops/operations.md; check 3 (module-map) added by P-004.

name: Agent-ops Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "docs/agent-ops/**"
      - ".cursor/rules/**"
      - ".codebuddy/rules/**"
      - "scripts/sync_agent_rules.py"
      - "scripts/audit_agent_ops.py"
      - "AGENTS.md"
      - ".gitignore"
      # P-004: a domain/route/whitelist change must re-run the module-map audit
      - "backend/app/routers/**"
      - "frontend/modules/**"
      - "scripts/frontend_domain_map.json"
      - "docs/architecture/**"
      - "docs/README.md"

concurrency:
  group: agent-ops-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-ops-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit parser selftest (in-memory, P-004)
        run: python scripts/audit_agent_ops.py --selftest

      - name: Run agent-ops audit (kernel-ref + doc drift + module-map)
        run: python scripts/audit_agent_ops.py
