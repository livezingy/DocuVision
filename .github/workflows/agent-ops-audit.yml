# Agent-ops audit — detect kernel-ref + living-doc drift + module-map recon.
# Unified framework: scripts/audit_agent_ops.py (no third-party deps).
# See docs/agent-ops/operations.md; check 3 (module-map) added by P-004.

name: Agent-ops Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "docs/agent-ops/**"
      - ".cursor/rules/**"
      - ".codebuddy/rules/**"
      # P-011 route B: every script is an audit input - its own implementation modules, the
      # gate scripts A0 looks symbols up in, `frontend_domain_map.json`. Pinned coarsely on
      # purpose: the precise list drifted once already (adding frontend_coupling.py as an
      # implementation dependency did not update it), and one missed input is silent.
      - "scripts/**"
      - "AGENTS.md"
      - ".gitignore"
      # The six hard rules' owning doc: a rule edit must re-run the audit.
      - "DEVELOPMENT.md"
      # A5 freshness compares module-map's version against the CHANGELOG's first [x.y.z] header.
      - "CHANGELOG.md"
      # P-004: a domain/route/whitelist change must re-run the module-map audit
      - "backend/app/routers/**"
      - "frontend/modules/**"
      - "docs/architecture/**"
      - "docs/README.md"
      # check 4 parses this workflow read-only for the Phase A test list, so editing it changes
      # the verdict. (This filter only affects `pull_request`; `push` to main has none.)
      - ".github/workflows/kie-phase-a.yml"
      # check 4's other truth sources: the registration table and the test files themselves.
      - "backend/tests/**"

concurrency:
  group: agent-ops-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-ops-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Audit parser selftest (in-memory, P-004)
        run: python scripts/audit_agent_ops.py --selftest

      - name: Run agent-ops audit (kernel-ref + doc drift + module-map)
        run: python scripts/audit_agent_ops.py
