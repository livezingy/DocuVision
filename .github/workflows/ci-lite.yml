# DocuVision Lite — CPU contract tests
# See docs/architecture/lite-api.md and apps/lite/backend/tests/README.md

name: CI Lite

# Push does not trigger CI by default. Run manually (workflow_dispatch) or open a PR to main.
# Optional push trigger: include "[run ci]" in the commit message (see .cursor/rules/003-git.mdc).
on:
  workflow_dispatch:
  push:
    branches: [main, feature/docuvision-lite]
    paths:
      - "apps/lite/**"
      - "packages/docuvision-core/**"
      - "docs/architecture/lite-api.md"
      - ".github/workflows/ci-lite.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/lite/**"
      - "packages/docuvision-core/**"
      - "docs/architecture/lite-api.md"
      - ".github/workflows/ci-lite.yml"

concurrency:
  group: ci-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lite-contract:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/lite/backend/requirements-lite.txt
            packages/docuvision-core/pyproject.toml

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ghostscript tesseract-ocr

      - name: Install Lite backend
        working-directory: apps/lite/backend
        run: pip install -r requirements-lite.txt

      - name: Run docuvision-core tests
        working-directory: packages/docuvision-core
        run: pip install -e ".[lite,dev]" && pytest tests/extractors/test_factory.py tests/processing/test_table_type_classifier.py -q

      - name: Run Lite API tests
        working-directory: apps/lite/backend
        run: python -m pytest tests/ -q
