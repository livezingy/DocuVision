# File-size + route-architecture gate (v1.8.2) + frontend structure + baseline gates (v1.8.3)
# + the Pro e2e suite (P-008 gap 2, step 2, 2026-09-20).
# Rules: DEVELOPMENT.md (owning doc); kernel: docs/agent-ops/core/routing.md + frontend.md.
# The Python scripts are stdlib-only; three steps need Node (frontend ESLint - P-010 stage 3,
# the vitest unit suite, and the e2e job) - all install from the lockfile, so
# `frontend/package-lock.json` is authoritative.
# Cost / trigger notes (job minutes, public-vs-private, noise policy): docs/agent-ops/operations.md.

name: Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "scripts/**", ".github/workflows/lint.yml"]
  pull_request:
    branches: [main]
    # 2026-09-20 (branch protection): `paths` dropped on purpose. `lint` and `e2e` are
    # required status checks on main (ruleset `main-branch-protection`), and a path-filtered
    # workflow that does not run leaves its required check in "Expected" - the PR could
    # never merge. Push keeps its paths: direct pushes to main are rejected by the ruleset
    # anyway, so the filter only matters for a bypass. Cost per PR: lint 15s + e2e ~45s hot
    # + audit 9s (public repo, free minutes) - see docs/agent-ops/operations.md.

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Pinned, not `ubuntu-latest`: GitHub announced that the label migrates to Ubuntu 26 on
    # 2026-10-19, and setup-python / Playwright's --with-deps both run on the image - a passive
    # migration would turn an unrelated Tuesday into a red CI. Upgrade this on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: File-size gate (500-line budget + ratchet)
        run: python scripts/lint_file_size.py

      - name: Route-architecture lint
        run: python scripts/lint_routes.py

      - name: Frontend structure lint
        run: python scripts/lint_frontend.py

      - name: Frontend baseline gate (C1-C8 + C9 injection fidelity)
        run: python scripts/check_frontend_baseline.py

      # The e2e gate's own hygiene (allowlist shape / staleness / ratchet cap, suite pin) needs no
      # node, so it sits with the stdlib gates: if a path filter ever skips the `e2e` job below,
      # the rules that stop the allowlist from rotting are still evaluated. It only checks the
      # tolerance list and that the suite did not shrink - it never runs the browser.
      - name: E2E allowlist + suite pin
        run: python scripts/check_e2e_allowlist.py

      # P-010: the only gate that sees dead code / unused bindings - F1-F7 and C1-C8 are
      # structural and cannot. Kept last so the stdlib gates fail before npm ci runs.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend toolchain (from lockfile)
        run: npm ci
        working-directory: frontend

      - name: Frontend ESLint (no-unused-vars + no-undef)
        run: npm run lint
        working-directory: frontend

      # v1.9 S0: vitest joins CI. S1's acceptance depends on unit tests actually running
      # (otherwise they are paper-verified, the P-008 "declared but never run" shape), and the
      # unit suite (preview-state semantics, envelope display, CSV/queue/bootstrap structure) gets
      # CI protection. 2026-09-26: it is pinned by scripts/unit_suite_pin.json (gate E2) so it
      # cannot shrink silently - and the count deliberately lives in that pin, not here: the old
      # "80 unit tests" figure was stale (geometry's tests retired in v1.9 S4) and this file is a
      # red line to edit. ~23s locally with jsdom.
      - name: Frontend unit tests (vitest)
        run: npm run test:unit
        working-directory: frontend

  # P-008 gap 2, step 2 (2026-09-20): the runtime-error assertion now guards the merged code, not
  # just a local run - it is the only gate that sees a page which throws while the DOM assertions
  # still pass (P-016 was 8 pageerrors behind a 14/14 green suite). Advisory: branch protection is
  # not enabled on main, so a red here does not block a merge; that half of gap 2 stays open.
  # It also runs for backend-only changes (workflow-level `paths`), an accepted ~2 min cost - see
  # operations.md. A separate workflow with frontend-only paths was the alternative.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # playwright.config.js starts the static server with python3 (scripts/e2e_static_server.py).
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend toolchain (from lockfile)
        run: npm ci
        working-directory: frontend

      # The cache key follows the lockfile, which pins the @playwright/test version, so a stale
      # cache can never outlive a version bump (a mismatch would install nothing and fail loudly).
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # --with-deps is not cached (apt system libraries) and is what lets the browser launch.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run e2e suite (case count pinned in scripts/e2e_suite_pin.json; a pageerror or console.error fails the test)
        run: npm run test:e2e
        working-directory: frontend

      # The coverage report plus the JSON/JUnit/trace output is the diagnosis for a red run.
      # `always()` matters: the interesting failure may happen before the suite starts, and
      # `if-no-files-found: ignore` keeps a missing directory from becoming a second error.
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: test_data/TestResult/PhaseUI
          if-no-files-found: ignore
          retention-days: 7
