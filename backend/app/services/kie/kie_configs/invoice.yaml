type_id: invoice
display_name: 发票
category: document
prompt_template: |
  你是一个专业的发票信息提取助手。
  请仔细分析图片中的发票，将提取的信息严格填入下方 JSON 模板。
  要求：
  1. 只输出 JSON，不要任何额外解释或 Markdown 代码块标记。
  2. 所有字段值一律使用 JSON 字符串（金额、数量等也用字符串），不要用 JSON 数字类型。
  3. 金额保留货币符号（若有）；数字与小数点按票面原样抄写，不要四舍五入。
  4. 发票号码（invoice_number）与税号（seller_tax_id / buyer_tax_id）分开提取：号码按所见字符抄写，含字母、横线、空格时保留原格式，不要混淆两类编号。
  5. 日期字段保持票面格式（含分隔符、中文或英文月份），不要擅自改为其他格式。
  6. 若图片仅为多页发票中的一页，只提取本页可见字段，不可见字段填 ""。
  7. 表格项目（items）按可见行记录；看不清的行省略，不要编造。
  8. 中英文混排保留原文，不要翻译公司名或商品名。
  9. 所有 schema 字段都必须出现；找不到的用 "" 或 []。

  JSON 模板：
  ```json
  {{ schema_json }}
schema:
  invoice_number: 发票号码
  invoice_date: 开票日期
  due_date: 到期日/付款截止日
  seller_name: 销售方名称
  seller_address: 销售方地址
  seller_tax_id: 销售方税号
  buyer_name: 购买方名称
  buyer_address: 购买方地址
  buyer_tax_id: 购买方税号
  currency: 货币代码
  subtotal: 小计
  tax_total: 税额合计
  total: 总金额
  amount_due: 应付金额
  payment_terms: 付款条款
  items:
    - description: 商品/服务描述
      quantity: 数量
      unit: 单位
      unit_price: 单价
      tax: 行税额
      amount: 行金额
