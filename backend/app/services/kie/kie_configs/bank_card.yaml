type_id: bank_card
display_name: 银行卡
category: card
prompt_template: |
  你是一个银行卡信息提取助手。
  请从图片中提取银行卡的信息，严格填入 JSON 模板。
  要求：
  1. 只输出 JSON，不要解释或 Markdown 代码块标记。
  2. 所有字段值使用 JSON 字符串。
  3. 卡号（bank_card_number）：仅保留可见数字，去除空格与分隔符；按所见位数抄写，不要猜测缺失数字或 Luhn 校验位。
  4. 有效期（valid_thru）保持票面格式（如 MM/YY），不要改写。
  5. 不要提取或编造 CVV、PIN、磁条信息等 schema 未列出的敏感字段。
  6. 若卡面遮挡、反光导致无法识别，对应字段填 ""。
  7. 所有 schema 字段都必须出现。

  JSON 模板：
  ```json
  {{ schema_json }}
schema:
  bank_name: 银行名称
  bank_card_number: 银行卡号
  bank_card_type: 银行卡类型（借记卡/信用卡）
  valid_thru: 有效期至（MM/YY）
  bank_card_issuer: 发卡行
